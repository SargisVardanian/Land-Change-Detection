[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "land-change-detection"
version = "0.1.0"
description = "Semantic land-surface mapping workspace for T1/T2 satellite imagery."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "einops>=0.8.2",
  "numpy>=2.0,<3",
  "pillow>=10.4",
  "streamlit-extras>=0.7.0",
  "streamlit-cropper>=0.2.2",
  "huggingface_hub>=0.34.0",
  "sentencepiece>=0.2.0",
  "streamlit>=1.44",
  "tiktoken>=0.12.0",
  "transformers>=4.52.0",
  "accelerate>=1.5.0",
  "qwen-vl-utils>=0.0.8",
  "timm>=1.0.25",
  "tifffile>=2025.2.18",
  "torch>=2.6",
  "torchvision>=0.21"
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["mlx-lm>=0.30.7", "huggingface_hub>=0.34.0"]
vlm = ["mlx-vlm>=0.3.12", "huggingface_hub>=0.34.0"]
eo = ["tifffile>=2025.2.18"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
